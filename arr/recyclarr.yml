# Recyclarr config: a PS5-Friendly quality profile for Radarr and Sonarr.
# Target: Plex for PlayStation 5. The app direct-streams H.264 (8-bit) and HEVC Main/Main 10
# (HDR10, Dolby Vision with an HDR10 fallback); Plex transcodes audio it can't pass through.
# Anything scored -10000 is rejected (min_format_score -100). Upgrades are off, so applying
# the profile to an existing library never re-downloads it.
# Secrets (base_url, api_key) live in secrets.yml next to this file.

radarr:
  radarr-ps5:
    base_url: !secret radarr_url
    api_key: !secret radarr_api_key
    delete_old_custom_formats: true

    quality_profiles:
      - name: PS5-Friendly
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: false
          until_quality: Bluray-2160p  # required by the API even with upgrades off
        min_format_score: -100  # rejects -10000 formats; mild audio penalties only break ties
        quality_sort: top
        qualities:
        - name: Bluray-2160p
        - name: WEB 2160p
          qualities: [WEBDL-2160p, WEBRip-2160p]
        - name: Bluray-1080p
        - name: WEB 1080p
          qualities: [WEBDL-1080p, WEBRip-1080p]
        - name: Bluray-720p
        - name: WEB 720p
          qualities: [WEBDL-720p, WEBRip-720p]

    custom_formats:
      # PS5 cannot play the video (pink screen / crash), or the server must transcode it
      - trash_ids:
          - 923b6abef9b17f937fab56cfcf89e1f1  # DV (w/o HDR fallback)
          - cae4ca30163749b891686f95532519bd  # AV1
          - ae4cfaa9283a4f2150ac3da08e388723  # VP9
          - 11cd1db7165d6a7ad9a83bc97b8b1060  # VC-1
          - ff86c4326018682f817830ced463332b  # MPEG2
          - 79472802acd400badf722871805171f8  # PS5 - x264 10bit (Hi10P) (local)
          - c6bb7165b6c415e7bc6e32139ddad189  # PS5 - XviD/DivX (local)
        assign_scores_to:
          - name: PS5-Friendly
            score: -10000
      # English must be the first audio track: Plex for PS5 plays the default track. Release titles
      # can't show track order, so reject the release types that usually put another language first.
      - trash_ids:
          - 0dc8aec3bd1c47cd6c40c46ecd27e846  # Language: Not English
          - b6832f586342ef70d9c128d40c07b872  # Bad Dual Groups
          - 4b900e171accbfb172729b63323ea8ca  # MULTi
          - 12720de67b0e54dc59738ff1db2eefa6  # PS5 - Dual Audio (local)
        assign_scores_to:
          - name: PS5-Friendly
            score: -10000
      # Not a playable movie file
      - trash_ids:
          - ed38b889b31be83fda192888e2286d83  # BR-DISK
          - b8cd450cbfa689c0259a01d9e29ba3d6  # 3D
          - 0a3f082873eb454bde444150b70253cc  # Extras
        assign_scores_to:
          - name: PS5-Friendly
            score: -10000
      # Low quality (TRaSH defaults)
      - trash_ids:
          - 90a6f9a284dff5103f6346090e6280c8  # LQ
          - e204b80c87be9497a8a6eaff48f72905  # LQ (Release Title)
          - bfd8eb01832d646a0a89c4deb46f8564  # Upscaled
        assign_scores_to:
          - name: PS5-Friendly
            score: -10000
      # Audio the PS5 app plays without a server transcode
      - trash_ids:
          - 185f1dd7264c4562b9022d963ac37424  # DD+
          - 1af239278386be2919e1bcee0bde047e  # DD+ ATMOS
        assign_scores_to:
          - name: PS5-Friendly
            score: 30
      - trash_ids:
          - c2998bd0d90ed5621d8df281e839436e  # DD
          - 240770601cc226190c367ef59aba7463  # AAC
        assign_scores_to:
          - name: PS5-Friendly
            score: 20
      # Lossless audio: Plex transcodes it to AAC; prefer lighter tracks
      - trash_ids:
          - 3cafb66171b47f226146a0770576870f  # TrueHD
          - 496f355514737f7d83bf7aa4d24f8169  # TrueHD ATMOS
          - dcf3ec6938fa32445f590a4da84256cd  # DTS-HD MA
          - 2f22d89048b01681dde8afe203bf2e95  # DTS X
        assign_scores_to:
          - name: PS5-Friendly
            score: -20
      - trash_ids:
          - 1c1a4c5e823891c75bc50380a6866f73  # DTS
        assign_scores_to:
          - name: PS5-Friendly
            score: -10

